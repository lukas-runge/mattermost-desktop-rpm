name: bump

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Update spec to latest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/mattermost/desktop/releases/latest --jq .tag_name | sed 's/^v//')
          current=$(awk '/^Version:/{print $2}' mattermost-desktop.spec)
          if [ "$latest" = "$current" ]; then
            echo "Already at $current"
            exit 0
          fi

          # Upstream sometimes publishes the release before all assets are uploaded.
          assets=$(gh api "repos/mattermost/desktop/releases/tags/v$latest" --jq '.assets[].name')
          for arch in x86_64 aarch64; do
            if ! grep -qx "mattermost-desktop-$latest-linux-$arch.rpm" <<<"$assets"; then
              echo "RPM for $arch not uploaded yet, retrying next run"
              exit 0
            fi
          done

          sed -i "s/^Version:.*/Version:        $latest/; s/^Release:.*/Release:        1%{?dist}/" mattermost-desktop.spec
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update to $latest"
          git push

      # GitHub disables scheduled workflows after 60 days without repo activity.
      - name: Keep schedule alive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/bump.yml/enable" && exit 0
            sleep 10
          done
          exit 1
